<app-header />
<main>
  <div>
    <ul id="users">
      @for (user of users; track user.id;) {
        <li>
          <app-user
            [user]="user"
            (select)="onSelectedUser($event)"
          />
        </li>
      }
    </ul>
  </div>


  @if (currentUserName){
    <div>
      <app-tasks
        [currentUserName] ="currentUserName"
      />
    </div>
  } @else {
    <p>Select a user too see their tasks</p>
  }
</main>
