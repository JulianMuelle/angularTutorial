<app-header />
<main>
  <div>
    <ul id="users">
      @for (user of users; track user.id) {
        <li>
          <app-user
            [user]="user"
            (select)="onSelectedUser($event)"
          />
      }
    </ul>
  </div>
  @if(selectedUser){
    <div>
      <app-tasks
        [userName] ="selectedUser.name"
        [userId] = "selectedUser.id"
      />
    </div>
  } @else{
    <p>Select as User to see his tasks!</p>
  }
</main>
