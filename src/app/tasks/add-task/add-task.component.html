<p>add-task works!</p>
<div class="backdrop" (click)="onCancelNewTaskForm()"></div>
<dialog open>
  <h2>Add Task</h2>
  <form (ngSubmit)="onSubmitNewTaskForm()">
    <p>
      <label for="title">Title</label>
      <input [(ngModel)]="enteredTitle" type="text" id="title" name="title" />
    </p>

    <p>
      <label for="summary">Summary</label>
      <textarea [(ngModel)]="enteredSummary"  id="summary" rows="5" name="summary"></textarea>
    </p>

    <p>
      <label for="due-date">Due Date</label>
      <input [(ngModel)]="enteredDueDate" type="date" id="due-date" name="due-date" />
    </p>

    <p class="actions">
      <button type="button" (click)="onCancelNewTaskForm()">Cancel</button>
      <button type="submit" (click)="onSubmitNewTaskForm()">Create</button>
    </p>
  </form>
</dialog>
